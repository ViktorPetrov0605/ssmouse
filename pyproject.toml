[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssmouse"
version = "0.3.0"
description = "Open-source SteelSeries GG replacement for the Rival 3 Wireless: battery, DPI, lighting, buttons, power, firmware"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Viktor Petrov" }]
keywords = ["steelseries", "rival", "hid", "hidraw", "hidapi", "battery", "dpi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = [
    # Primary transport.  On Linux the wheel ships both the libusb ("hid") and
    # the /dev/hidraw ("hidraw") backends; the latter works with our udev rule
    # without root.  A pure-ctypes Linux fallback is built into ssmouse in case
    # this dependency cannot be installed.
    "hidapi>=0.14",
]

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]
dev = ["pytest>=7", "ruff"]

[project.urls]
Homepage = "https://github.com/ViktorPetrov0605/ssmouse"

[project.scripts]
ssmouse = "ssmouse.cli:main"

[project.gui-scripts]
ssmouse-gui = "ssmouse.gui.app:main"

[tool.setuptools]
packages = ["ssmouse", "ssmouse.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Keep lint focused on real defects; the project uses percent formatting on
# purpose (Python 3.10-compatible and clearer for byte/text messages).
select = ["E4", "E7", "E9", "F"]
